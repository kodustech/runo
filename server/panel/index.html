<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>runo — control plane</title>
<link rel="stylesheet" href="/app.css" />
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1><span class="dot">●</span> runo <span class="dim">control plane</span></h1>
    <div class="who" id="who" hidden>
      <img id="avatar" alt="" width="22" height="22" hidden />
      <span id="whoName"></span>
      <span class="tag" id="whoRole" hidden>admin</span>
      <button id="logout" class="quiet">log out</button>
    </div>
  </header>

  <section id="login" hidden>
    <div class="card login">
      <h2>Sign in</h2>
      <p class="dim">Environments, history and cost of your runo fleet.</p>
      <p class="error" id="loginError" hidden></p>
      <a class="btn primary" id="githubLogin" href="/auth/github" hidden>Continue with GitHub</a>
      <details id="tokenLogin">
        <summary>Use an access token</summary>
        <form id="tokenForm" class="row">
          <input id="token" type="password" autocomplete="off" placeholder="access token" required />
          <button type="submit">sign in</button>
        </form>
        <p class="dim small">The token is exchanged for a session cookie; it is not kept in this browser.</p>
      </details>
    </div>
  </section>

  <section id="app" hidden>
    <nav class="tabs" id="tabs" role="tablist">
      <button role="tab" data-tab="overview">overview</button>
      <button role="tab" data-tab="envs">environments</button>
      <button role="tab" data-tab="history">history</button>
      <button role="tab" data-tab="activity">activity</button>
      <button role="tab" data-tab="settings">settings</button>
      <span class="spacer"></span>
      <label class="range">window
        <select id="days">
          <option value="7">7 days</option>
          <option value="30" selected>30 days</option>
          <option value="90">90 days</option>
          <option value="365">1 year</option>
        </select>
      </label>
    </nav>
    <p class="msg" id="msg" role="status"></p>
    <main id="view"></main>
  </section>
</div>
<div id="tip" class="tip" hidden></div>
<script src="/app.js" defer></script>
</body>
</html>
