# runo-server org policies — copy to $RUNO_HOME/policies.yaml (server side).
# Re-read on every request: edits apply immediately, no restart needed.
# Every field is optional; absent = unlimited.
#
# The recipe in each repo decides the machine for that workload (by PR);
# these are the platform team's CEILINGS on what any recipe/user may ask for.

# Exact-match allowlist of instance types recipes may request:
allowed_instance_types: [t3.medium, t3.large, t3.xlarge, t3a.xlarge]

# Maximum root disk a recipe may request:
max_disk_gb: 150

# Maximum RUNNING environments a single user may have at once (stopped ones cost only EBS):
max_envs_per_user: 3

# Org-wide ceiling of RUNNING instances (stopped ones cost only EBS):
max_running_total: 9

# Auto-destroy environments older than this many days (fractions allowed).
# The sweeper runs at startup and every 10 minutes.
env_ttl_days: 7

# Retire environments stopped for this many days (1.5 = 36 hours without use;
# fractions allowed): the sweeper snapshots their
# disks (tagged cleanup=runo-retired-<date> and runo:retired-from=<instance>),
# then terminates the instance once the snapshots complete. Restore is by hand
# from the snapshot; `runo up` rebuilds a branch's env from the repo anyway.
retire_stopped_after_days: 1.5
# Only log what would be retired (start with this on to see the list):
# retire_dry_run: true

# Ports any user may open to the world (default: 80 and 443, what expose
# mode https needs). Other ports take an admin. [] = admins only.
# allowed_public_ports: [80, 443]
