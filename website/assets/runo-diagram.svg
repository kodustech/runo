<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc"><title id="title">How Runo environments work</title><desc id="desc">A Git branch on your machine sends code and its recipe to an AWS environment. The agent, application and configured database run there. A preview URL lets you inspect the application, and validation evidence returns locally.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#8cca48"/></marker></defs><rect width="1200" height="580" rx="16" fill="#111713"/><g font-family="sans-serif" fill="#edf5e7"><text x="48" y="60" font-size="30" font-weight="600">runo</text><text x="145" y="57" font-size="13" fill="#a1b194">REMOTE ENVIRONMENTS PER BRANCH</text><path d="M48 84H1152" stroke="#34432f"/><text x="60" y="140" font-size="13" fill="#a1b194">YOUR MACHINE</text><rect x="60" y="165" width="310" height="130" rx="8" fill="#1c291a" stroke="#415637"/><text x="85" y="211" font-size="23">Your repository</text><text x="85" y="253" font-size="18" fill="#c2fa69" font-family="monospace">task/checkout-fix</text><rect x="60" y="351" width="310" height="98" rx="8" fill="#1c291a" stroke="#415637"/><text x="85" y="392" font-size="21">Validation results</text><text x="85" y="421" font-size="16" fill="#a1b194">Logs + JSON + Markdown</text><path d="M377 220H548" stroke="#8cca48" stroke-width="2" marker-end="url(#arrow)"/><text x="400" y="198" font-size="13" fill="#a1b194">code + recipe</text><path d="M552 401H382" stroke="#8cca48" stroke-width="2" marker-end="url(#arrow)"/><text x="390" y="380" font-size="12" fill="#a1b194">changes + evidence</text><rect x="565" y="125" width="575" height="345" rx="9" fill="#182315" stroke="#759e4a"/><text x="592" y="160" font-size="13" fill="#c2fa69">DEDICATED AWS ENVIRONMENT</text><rect x="589" y="184" width="527" height="88" rx="5" fill="#293920"/><text x="615" y="221" font-size="22">Your coding agent</text><text x="615" y="249" font-size="16" fill="#adc69a">Claude Code / Codex</text><rect x="589" y="289" width="254" height="90" rx="5" fill="#1c291a" stroke="#3a4b31"/><rect x="861" y="289" width="255" height="90" rx="5" fill="#1c291a" stroke="#3a4b31"/><text x="615" y="326" font-size="22">Application</text><text x="615" y="354" font-size="16" fill="#a1b194">port :3000</text><text x="885" y="326" font-size="22">Database</text><text x="885" y="354" font-size="16" fill="#a1b194">from your recipe</text><text x="595" y="432" font-size="19" fill="#c2fa69">Open the app through its preview URL</text><path d="M48 501H1152" stroke="#34432f"/><text x="60" y="545" font-size="17" fill="#c2fa69" font-family="monospace">new → agent → preview → validate</text><text x="840" y="545" font-size="16" fill="#b8c9ac">Explore the flow at runo.sh</text></g></svg>
