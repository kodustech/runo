#cloud-config
# Provisioning for runo VMs (Ubuntu 24.04 LTS).
# `runo up` waits for `cloud-init status --wait` before any setup.
package_update: true

write_files:
  # Idle auto-suspend: the VM shuts itself down (shutdown => EC2 "stopped",
  # which is runo suspend — EBS intact, runo resume brings it back).
  # Activity = established SSH | load >= 0.20 | network traffic | agent CPU
  # (claude/codex). Limit in seconds at /etc/runo/idle-limit (written by
  # runo up from limits.idle_suspend; 0 = disabled).
  - path: /usr/local/bin/runo-idle-check
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -u
      LIMIT=$(cat /etc/runo/idle-limit 2>/dev/null || echo 600)
      case "$LIMIT" in (*[!0-9]*|"") exit 0;; esac
      [ "$LIMIT" -le 0 ] && exit 0
      STATE=/run/runo-idle; mkdir -p "$STATE"
      now=$(date +%s); active=""
      ss -Htn state established '( sport = :22 )' 2>/dev/null | grep -q . && active=ssh
      if [ -z "$active" ]; then
        awk '{ exit ($1 >= 0.20) ? 0 : 1 }' /proc/loadavg && active=load
      fi
      if [ -z "$active" ]; then
        bytes=$(awk -F'[: ]+' 'NR>2 && $2 != "lo" { rx+=$3; tx+=$11 } END { printf "%d", rx+tx }' /proc/net/dev)
        prev=$(cat "$STATE/netbytes" 2>/dev/null || echo 0)
        echo "$bytes" > "$STATE/netbytes"
        [ $((bytes - prev)) -gt 102400 ] && active=net
      fi
      if [ -z "$active" ]; then
        for pid in $(pgrep -x claude; pgrep -x codex); do
          t=$(awk '{ print $14+$15 }' "/proc/$pid/stat" 2>/dev/null) || continue
          prev=$(cat "$STATE/agent-$pid" 2>/dev/null || echo -1)
          echo "$t" > "$STATE/agent-$pid"
          if [ "$t" != "$prev" ]; then active=agent; break; fi
        done
      fi
      if [ -n "$active" ] || [ ! -f "$STATE/last-active" ]; then
        echo "$now" > "$STATE/last-active"; exit 0
      fi
      last=$(cat "$STATE/last-active")
      if [ $((now - last)) -ge "$LIMIT" ]; then
        logger -t runo "auto-suspend: idle for $((now - last))s (limit ${LIMIT}s)"
        systemctl poweroff
      fi
  - path: /etc/cron.d/runo-idle
    permissions: "0644"
    content: |
      * * * * * root /usr/local/bin/runo-idle-check

packages:
  - git
  - tmux
  - rsync
  - curl
  - ca-certificates
  - unzip
  - netcat-openbsd
  - docker.io
  - docker-compose-v2
  - docker-buildx
  # EC2 hibernation (RAM → EBS on suspend; resume comes back with services hot)
  - ec2-hibinit-agent

runcmd:
  - systemctl enable --now docker
  - usermod -aG docker ubuntu
  # Node 22 (NodeSource)
  - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
  - apt-get install -y nodejs
  # pnpm + coding agent CLIs
  - npm install -g pnpm @anthropic-ai/claude-code @openai/codex
  # bun for the ubuntu user
  - su - ubuntu -c 'curl -fsSL https://bun.sh/install | bash'
  - echo 'export PATH=/home/ubuntu/.bun/bin:$PATH' > /etc/profile.d/runo-path.sh
  # git usable by the agent on the VM
  - git config --system user.name runo
  - git config --system user.email runo@kodus.local
  - git config --system init.defaultBranch main
  - git config --system --add safe.directory '*'
  # runo state on the VM
  - mkdir -p /home/ubuntu/.runo/logs /home/ubuntu/.runo/evidence/logs
  - chown -R ubuntu:ubuntu /home/ubuntu/.runo
  - mkdir -p /etc/runo
