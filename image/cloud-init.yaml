#cloud-config
# Provisioning for runo VMs (Ubuntu 24.04 LTS).
# `runo up` waits for `cloud-init status --wait` before any setup.
package_update: true

write_files:
  # Idle auto-suspend: the VM shuts itself down (shutdown => EC2 "stopped",
  # which is runo suspend — EBS intact, runo resume brings it back).
  # Activity = established SSH | EXTERNAL network traffic | agent CPU
  # (claude/codex). Deliberately NOT load/internal traffic: dev stacks in
  # watch mode keep both high forever with nobody using the env.
  # Limit in seconds at /etc/runo/idle-limit (0 = disabled).
  - path: /usr/local/bin/runo-idle-check
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -u
      LIMIT=$(cat /etc/runo/idle-limit 2>/dev/null || echo 600)
      case "$LIMIT" in (*[!0-9]*|"") exit 0;; esac
      [ "$LIMIT" -le 0 ] && exit 0
      STATE=/run/runo-idle; mkdir -p "$STATE"
      now=$(date +%s); active=""
      ss -Htn state established '( sport = :22 )' 2>/dev/null | grep -q . && active=ssh
      if [ -z "$active" ]; then
        # default-route interface only: container-to-container chatter and
        # watch-mode rebuild loops must not count as user activity
        IFACE=$(ip route show default 2>/dev/null | awk '{print $5; exit}')
        if [ -n "${IFACE:-}" ]; then
          bytes=$(awk -F'[: ]+' -v ifc="$IFACE" 'NR>2 && $2 == ifc { print $3+$11; exit }' /proc/net/dev)
          prev=$(cat "$STATE/netbytes" 2>/dev/null || echo 0)
          echo "${bytes:-0}" > "$STATE/netbytes"
          [ $(( ${bytes:-0} - prev )) -gt 102400 ] && active=net
        fi
      fi
      if [ -z "$active" ]; then
        for pid in $(pgrep -x claude; pgrep -x codex); do
          t=$(awk '{ print $14+$15 }' "/proc/$pid/stat" 2>/dev/null) || continue
          prev=$(cat "$STATE/agent-$pid" 2>/dev/null || echo -1)
          echo "$t" > "$STATE/agent-$pid"
          if [ "$t" != "$prev" ]; then active=agent; break; fi
        done
      fi
      if [ -n "$active" ] || [ ! -f "$STATE/last-active" ]; then
        echo "$now" > "$STATE/last-active"; exit 0
      fi
      last=$(cat "$STATE/last-active")
      if [ $((now - last)) -ge "$LIMIT" ]; then
        logger -t runo "auto-suspend: idle for $((now - last))s (limit ${LIMIT}s)"
        systemctl poweroff
      fi
  - path: /etc/cron.d/runo-idle
    permissions: "0644"
    content: |
      * * * * * root /usr/local/bin/runo-idle-check

packages:
  - git
  - tmux
  - rsync
  - curl
  - ca-certificates
  - unzip
  - netcat-openbsd
  - docker.io
  - docker-compose-v2
  - docker-buildx
  # EC2 hibernation (RAM → EBS on suspend; resume comes back with services hot)
  - ec2-hibinit-agent

runcmd:
  - systemctl enable --now docker
  - usermod -aG docker ubuntu
  # Node 22 (NodeSource)
  - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
  - apt-get install -y nodejs
  # pnpm + coding agent CLIs
  - npm install -g pnpm @anthropic-ai/claude-code @openai/codex
  # bun for the ubuntu user
  - su - ubuntu -c 'curl -fsSL https://bun.sh/install | bash'
  - echo 'export PATH=/home/ubuntu/.bun/bin:$PATH' > /etc/profile.d/runo-path.sh
  # caddy: expose.mode "https" (the default for new recipes) terminates TLS
  # here, with a Let's Encrypt certificate for the VM's sslip.io name
  - apt-get install -y -qq debian-keyring debian-archive-keyring apt-transport-https
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | gpg --batch --yes --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' > /etc/apt/sources.list.d/caddy-stable.list
  - apt-get update -qq && apt-get install -y -qq caddy
  # cloudflared: recipes with expose.mode "tunnel" get an HTTPS URL per service
  # without a single inbound port open (the VM dials out to Cloudflare)
  - ARCH=$(dpkg --print-architecture); curl -fsSL -o /tmp/cloudflared.deb "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-${ARCH}.deb" && dpkg -i /tmp/cloudflared.deb; rm -f /tmp/cloudflared.deb
  # git usable by the agent on the VM
  - git config --system user.name runo
  - git config --system user.email runo@kodus.local
  - git config --system init.defaultBranch main
  - git config --system --add safe.directory '*'
  # runo state on the VM
  - mkdir -p /home/ubuntu/.runo/logs /home/ubuntu/.runo/evidence/logs
  - chown -R ubuntu:ubuntu /home/ubuntu/.runo
  - mkdir -p /etc/runo
