allowed_instance_types: [t3.medium, t3.large, t3.xlarge, t3a.medium, t3a.large, t3a.xlarge]
max_disk_gb: 100
max_envs_per_user: 5
max_running_total: 5
# Envs stopped 36 hours (1.5 days) are snapshotted, then terminated
# (decided 2026-11-27). Restore by hand from the snapshot, or `runo up`.
retire_stopped_after_days: 1.5
